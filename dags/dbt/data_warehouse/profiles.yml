# Only for running dbt by hand and in CI. In the DAGs, Cosmos builds the profile
# from the `postgres_dwh` Airflow Connection.
data_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres-dwh') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'postgres') }}"
      password: "{{ env_var('DBT_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'dwh') }}"
      schema: public
      threads: 4
