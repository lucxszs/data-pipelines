version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: bacen_ptax
        description: JSON cru de cada cotação do dólar na API PTAX do Banco Central.
        # Runs on weekdays, so the limit has to cover a weekend followed by a holiday.
        config:
          loaded_at_field: loaded_at
          freshness:
            error_after: {count: 6, period: day}
        columns:
          - name: data_hora_cotacao
            data_tests:
              - not_null
              - unique
