version: 2

models:
  - name: socios
    description: "Sócios das empresas recém-abertas, uma linha por sócio. Documento e data de entrada costumam vir nulos na fonte."
    columns:
      - name: cnpj
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('empresas')
                field: cnpj
      - name: nome_socio
        data_tests:
          - not_null

unit_tests:
  - name: socios_expands_array_and_ignores_company_without_partners
    model: socios
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('bronze', 'cnpjpw_empresas')
        rows:
          - {cnpj: "11111111000191", payload: '{"socios": null}'}
          - {cnpj: "22222222000180", payload: '{"socios": [{"nome": "SOCIO A"}, {"nome": "SOCIO B"}]}'}
    expect:
      rows:
        - {cnpj: "22222222000180", nome_socio: "SOCIO A"}
        - {cnpj: "22222222000180", nome_socio: "SOCIO B"}
