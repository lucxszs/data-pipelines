version: 2

models:
  - name: cotacao_dolar
    description: "Cotação do dólar por dia, com spread e variação em relação ao dia anterior."
    columns:
      - name: data_cotacao
        data_tests:
          - unique
          - not_null
      - name: spread
        data_tests:
          - not_null

unit_tests:
  - name: cotacao_dolar_calculates_spread_and_daily_variation
    model: cotacao_dolar
    given:
      - input: ref('ptax')
        rows:
          - {data_cotacao: "2026-10-01", compra: 5.0000, venda: 5.1000}
          - {data_cotacao: "2026-10-02", compra: 5.0500, venda: 5.1510}
    expect:
      rows:
        - {data_cotacao: "2026-10-01", spread: 0.1000, variacao_venda_pct: null}
        - {data_cotacao: "2026-10-02", spread: 0.1010, variacao_venda_pct: 1.0000}
