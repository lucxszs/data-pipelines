<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 385" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">CI e deploy</title>
  <desc id="d">Um push ou pull request dispara o GitHub Actions, que roda os lints e o dbt build em um Postgres descartável. Com o CI verde, o código entra na main, a imagem Docker é construída e sobe com astro dev start. O astro deploy é um caminho opcional que não está configurado neste repositório.</desc>
  <style>
    .title { font-size: 26px; font-weight: 700; fill: #f0f6fc; letter-spacing: -.2px; }
    .sub { font-size: 14px; fill: #8b949e; }
    .label { font-size: 15px; font-weight: 600; fill: #c9d1d9; }
    .side { font-size: 12px; fill: #8b949e; }
    .card { fill: url(#cardFill); stroke: #30363d; stroke-width: 1.2; filter: url(#shadow); }
    .group { fill: #0b0f14; fill-opacity: .55; stroke-width: 1.3; stroke-dasharray: 6 5; }
    .name { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
    .note { font-size: 12px; fill: #8b949e; }
    .mid { text-anchor: middle; }
    .glyph { font-family: Consolas, Menlo, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .line { fill: none; stroke: #6e7681; stroke-width: 1.8; }
    .accent { fill: none; stroke: #ff694b; stroke-width: 1.8; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 5; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -10; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
    @keyframes run {
      0% { fill: #161b22; stroke: #30363d; }
      2%, 15% { fill: #0f2e1b; stroke: #3fb950; }
      18%, 100% { fill: #161b22; stroke: #30363d; }
    }
    .task { fill: #161b22; stroke: #30363d; stroke-width: 1.2; animation: run 12s linear infinite; }
    .t2 { animation-delay: 2s; } .t3 { animation-delay: 4s; } .t4 { animation-delay: 6s; } .t5 { animation-delay: 8s; } .t6 { animation-delay: 10s; }
    .job { fill: #0f2e1b; stroke: #3fb950; stroke-width: 1.2; animation: pulse 3s ease-in-out infinite; }
    .job2 { animation-delay: 1.5s; }
    .glow { filter: url(#glow); }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } .flow, .job, .task { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#141b26"/></linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2330"/><stop offset="1" stop-color="#151a22"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  </defs>
  <rect width="1200" height="385" rx="18" fill="url(#bg)"/>
  <text x="30" y="44" class="title">CI e deploy</text>
  <text x="30" y="68" class="sub">Só entra na main o que passa nos lints e nos testes de dados</text>

